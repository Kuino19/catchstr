<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>catchstr Role Selection</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#101722", // Dark base text
                        "pitch-green": "#34d399", // Neon green accent
                        "pitch-green-light": "#ecfdf5", 
                        "pitch-green-hover": "#059669",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    boxShadow: {
                        "card": "0 4px 20px -2px rgba(0, 0, 0, 0.05)",
                        "card-hover": "0 10px 25px -5px rgba(52, 211, 153, 0.15)",
                    }
                },
            },
        }
    </script>
<style>
        body {
            min-height: 100vh;
        }.role-radio:checked + .role-card {
            border-color: #34d399;
            background-color: #f0fdf4;
            box-shadow: 0 4px 6px -1px rgba(52, 211, 153, 0.1), 0 2px 4px -1px rgba(52, 211, 153, 0.06);
        }
        .role-radio:checked + .role-card .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .role-radio:checked + .role-card .icon-container {
            background-color: #34d399;
            color: white;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-white font-display text-slate-900 min-h-screen flex flex-col justify-between p-6">
<div class="flex-1 flex flex-col">
<header class="flex justify-center pt-8 pb-6">
<div class="flex items-center gap-2">
<div class="h-8 w-8 bg-slate-900 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-pitch-green text-[20px]">sports_soccer</span>
</div>
<span class="font-bold text-xl tracking-tight text-slate-900">catchstr</span>
</div>
</header>
<div class="text-center mb-10">
<h1 class="text-2xl font-bold text-slate-900 mb-2">Welcome to the pitch!</h1>
<p class="text-slate-500 text-sm leading-relaxed max-w-xs mx-auto">
                Let's customize your experience. Tell us how you plan to use catchstr to achieve your goals.
            </p>
</div>
<form class="flex flex-col gap-5 flex-1 justify-center max-w-sm mx-auto w-full">
<label class="relative cursor-pointer group">
<input checked="" class="role-radio peer sr-only" name="role" type="radio" value="player"/>
<div class="role-card rounded-2xl border-2 border-slate-100 bg-white p-5 transition-all duration-300 hover:border-pitch-green/50 shadow-card hover:shadow-card-hover flex items-start gap-4">
<div class="icon-container h-12 w-12 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 transition-colors duration-300">
<span class="material-symbols-outlined text-[28px]">directions_run</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-lg text-slate-900 mb-1">I am a Player</h3>
<p class="text-xs text-slate-500 leading-relaxed">
                            Showcase your highlights, get scouted by top agencies, and connect with teammates.
                        </p>
</div>
<div class="check-icon absolute top-5 right-5 h-6 w-6 rounded-full bg-pitch-green flex items-center justify-center opacity-0 transform scale-75 transition-all duration-300">
<span class="material-symbols-outlined text-white text-[16px] font-bold">check</span>
</div>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="role-radio peer sr-only" name="role" type="radio" value="agent"/>
<div class="role-card rounded-2xl border-2 border-slate-100 bg-white p-5 transition-all duration-300 hover:border-pitch-green/50 shadow-card hover:shadow-card-hover flex items-start gap-4">
<div class="icon-container h-12 w-12 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center shrink-0 transition-colors duration-300">
<span class="material-symbols-outlined text-[28px]">business_center</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-lg text-slate-900 mb-1">I am an Agent/Scout</h3>
<p class="text-xs text-slate-500 leading-relaxed">
                            Discover emerging talent, manage your roster, and post recruitment opportunities.
                        </p>
</div>
<div class="check-icon absolute top-5 right-5 h-6 w-6 rounded-full bg-pitch-green flex items-center justify-center opacity-0 transform scale-75 transition-all duration-300">
<span class="material-symbols-outlined text-white text-[16px] font-bold">check</span>
</div>
</div>
</label>
</form>
</div>
<div class="pt-8 pb-4">
<button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-4 rounded-xl shadow-lg shadow-slate-200 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group">
            Continue
            <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center mt-4 text-xs text-slate-400">
            Already have an account? <a class="text-slate-900 font-semibold hover:underline" href="#">Log in</a>
</p>
</div>

</body></html>
